name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check for Python code
        id: pycheck
        run: |
          if find src tests scripts -name '*.py' -print -quit 2>/dev/null | grep -q .; then
            echo "has_python=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_python=false" >> "$GITHUB_OUTPUT"
            echo "No Python code yet (docs-only phase) - skipping lint, security scan and tests."
          fi

      - name: Set up Python
        if: steps.pycheck.outputs.has_python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tooling
        if: steps.pycheck.outputs.has_python == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with ruff
        if: steps.pycheck.outputs.has_python == 'true'
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Security scan with bandit
        if: steps.pycheck.outputs.has_python == 'true'
        run: bandit -r src -ll -q

      - name: Test with pytest
        if: steps.pycheck.outputs.has_python == 'true'
        run: |
          if [ -d tests ] && [ -n "$(find tests -name 'test_*.py' -print -quit)" ]; then
            pytest tests/ -q
          else
            echo "No tests yet - skipping pytest."
          fi
